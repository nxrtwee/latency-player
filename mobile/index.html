<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- The device default. src/uiScale.ts rewrites this meta before the first
         paint when the user has set an interface scale (that pref is a viewport
         width, see the file header) — so keep the tag, and keep it findable by
         `meta[name="viewport"]`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Latency</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
